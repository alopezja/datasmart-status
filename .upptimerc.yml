# Config de Upptime para status.datasmart.com.co
# Copiar este archivo a la raíz del repo nuevo "datasmart-status".
owner: alopezja
repo: datasmart-status
user-agent: alopezja

sites:
  - name: PRUEBA Notificacion
    url: https://www.datasmart.com.co/api/health/__prueba_caida__
    maxResponseTime: 2000
    expectedStatusCodes: [200]
  - name: Ventix
    url: https://www.datasmart.com.co/api/health/ventix
    maxResponseTime: 2000
    expectedStatusCodes: [200]
  - name: Axia
    url: https://www.datasmart.com.co/api/health/axia
    maxResponseTime: 2000
    expectedStatusCodes: [200]
  - name: DataSmart Chat
    url: https://www.datasmart.com.co/api/health/dschat
    maxResponseTime: 2000
    expectedStatusCodes: [200]
  - name: Servix
    url: https://www.datasmart.com.co/api/health/servix
    maxResponseTime: 2000
    expectedStatusCodes: [200]
  - name: Mindix
    url: https://www.datasmart.com.co/api/health/mindix
    maxResponseTime: 2000
    expectedStatusCodes: [200]
  - name: Bridge
    url: https://www.datasmart.com.co/api/health/bridge
    maxResponseTime: 2000
    expectedStatusCodes: [200]

status-website:
  cname: status.datasmart.com.co
  name: DataSmart · Estado del servicio
  # Logo alojado EN el repo de status (off-infra). Subir logo.png a la raíz del repo.
  logoUrl: https://raw.githubusercontent.com/alopezja/datasmart-status/master/logo.png
  introTitle: "Estado de los servicios de DataSmart"
  introMessage: "Estado en tiempo real de nuestros productos. Si ves un incidente, ya estamos al tanto."
  navbar:
    - title: Estado
      href: /
  theme: light

assignees:
  - alopezja

# Least-privilege de secrets (Telegram). NOTIFICATION_TELEGRAM=true activa el canal.
secrets:
  - NOTIFICATION_TELEGRAM
  - NOTIFICATION_TELEGRAM_BOT_KEY
  - NOTIFICATION_TELEGRAM_CHAT_ID

# ~40 claves i18n existen en Upptime; estas cubren lo visible. Las no definidas
# caen a inglés y se pueden ampliar luego desde la doc oficial de Upptime.
i18n:
  activeIncidents: Incidentes activos
  allSystemsOperational: Todos los sistemas operativos
  incidentReport: Reporte de incidente
  incidentTitle: Incidente
  live: En vivo
  operational: Operativo
  down: Caído
  degraded: Degradado
  responseTime: Tiempo de respuesta
  uptime: Disponibilidad
  pastIncidents: Incidentes pasados
  resolved: Resuelto
